<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Case Study | Amy Nguyen-Le</title>

    <link rel="stylesheet" href="styles.css" />

    <style>
      .case-page {
        max-width: 1100px;
        margin: auto;
        padding: 60px 30px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 30px;
        text-decoration: none;
        color: #0078d4;
        font-weight: 700;
      }

      .case-hero {
        padding: 50px;
        border-radius: 18px;
        color: white;
        margin-bottom: 40px;
      }

      .case-hero h1 {
        font-size: clamp(2.5rem, 6vw, 5rem);
        margin-bottom: 16px;
      }

      .case-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      .case-meta span {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 6px 12px;
      }

      .section-card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 25px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      }

      .section-card h2 {
        color: #163a63;
        margin-bottom: 15px;
      }

      .flow-box {
        background: #eaf4fb;
        border-left: 4px solid #0078d4;
        padding: 20px;
        white-space: pre-line;
        border-radius: 0 12px 12px 0;
        font-weight: 600;
      }

      .takeaway {
        background: #163a63;
        color: white;
        font-size: 1.2rem;
        border-radius: 16px;
        padding: 30px;
      }

      .navigation-links {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
      }

      .navigation-links a {
        text-decoration: none;
        color: #0078d4;
        font-weight: 700;
      }

      @media (max-width: 700px) {
        .navigation-links {
          flex-direction: column;
          gap: 20px;
        }

        .case-hero {
          padding: 30px;
        }
        .demo-notice {
          background: #fff8e7;
          border: 1px solid #f2d98c;
          color: #6c5200;
          padding: 16px 20px;
          border-radius: 12px;
          margin-bottom: 25px;
        }
      }
      .case-study-image {
        width: 100%;

        border-radius: 18px;

        margin: 30px 0;

        border: 1px solid #dfe7ef;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <header class="nav">
      <div class="logo">
        <a href="index.html"> AMY NGUYEN-LE </a>

        <span> SharePoint & Power Platform Consultant </span>
      </div>
    </header>

    <main id="caseContent" class="case-page"></main>

    <script src="case-studies.js"></script>
  </body>
</html>
